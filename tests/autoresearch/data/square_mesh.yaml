seed: 42
network:
  nodes:
    N1: {}
    N2: {}
    N3: {}
    N4: {}
  links:
    - source: N1
      target: N2
      capacity: 2.0
      cost: 1.0
    - source: N1
      target: N3
      capacity: 1.0
      cost: 1.0
    - source: N1
      target: N4
      capacity: 2.0
      cost: 1.0
    - source: N2
      target: N3
      capacity: 2.0
      cost: 1.0
    - source: N2
      target: N4
      capacity: 1.0
      cost: 1.0
    - source: N3
      target: N4
      capacity: 2.0
      cost: 1.0
failures:
  single_link_failure:
    modes:
      - weight: 1.0
        rules:
          - scope: link
            mode: choice
            count: 1
demands:
  baseline_traffic_matrix:
    - source: ^N([1-4])$
      target: ^N([1-4])$
      volume: 12.0
      mode: pairwise
      attrs:
        euclidean_km: 10
workflow:
  - type: MaximumSupportedDemand
    name: msd_baseline
    demand_set: baseline_traffic_matrix
    alpha_start: 1.0
    growth_factor: 2.0
    alpha_min: 0.001
    alpha_max: 1000000.0
    alpha_tolerance: 0.05
    max_bracket_iters: 16
    max_bisect_iters: 32
  - type: TrafficMatrixPlacement
    name: tm_placement
    demand_set: baseline_traffic_matrix
    failure_policy: single_link_failure
    iterations: 1000
    workers: 8
    seed: 42
    failure_trace: true
    outputs:
      cost_distribution: true
    alpha_from_step: msd_baseline

  - type: MaxFlow
    name: node_to_node_capacity_matrix
    source: ^(N[1-4])$
    target: ^(N[1-4])$
    mode: pairwise
    failure_policy: single_link_failure
    iterations: 1000
    workers: 8
    seed: 42
    failure_trace: true
    outputs:
      cost_distribution: true
      min_cut: true

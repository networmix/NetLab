# Four parallel backbone paths, each with capacity 100 Gbps.
# Each DC node connects to every local BB node; demand is 1,000 Gbps.

blueprints:
  DC:
    nodes:
      node:
        count: 1
        template: "{n}"
  BB:
    nodes:
      node:
        count: 1
        template: "{n}"

network:
  nodes:
    SiteA/DC-[1-4]:
      blueprint: DC
      attrs: { role: dc, site: A }
    SiteA/BB-[1-4]:
      blueprint: BB
      attrs: { role: bb, site: A }
    SiteB/BB-[1-4]:
      blueprint: BB
      attrs: { role: bb, site: B }
    SiteB/DC-[1-4]:
      blueprint: DC
      attrs: { role: dc, site: B }

  links:
    # All DC to all BB at Site A (high capacity)
    - source: "SiteA/DC-${dc}/"
      target: "SiteA/BB-${bb}/"
      expand:
        vars:
          dc: [1, 2, 3, 4]
          bb: [1, 2, 3, 4]
      capacity: 1000
      cost: 1

    # BB-A to BB-B (1:1, bottleneck)
    - source: "SiteA/BB-${i}/"
      target: "SiteB/BB-${i}/"
      expand:
        vars:
          i: [1, 2, 3, 4]
      capacity: 100
      cost: 10

    # All BB to all DC at Site B (high capacity)
    - source: "SiteB/BB-${bb}/"
      target: "SiteB/DC-${dc}/"
      expand:
        vars:
          bb: [1, 2, 3, 4]
          dc: [1, 2, 3, 4]
      capacity: 1000
      cost: 1

demands:
  test:
    - source: "^SiteA/DC"
      target: "^SiteB/DC"
      volume: 1000
      mode: combine
      flow_policy: SHORTEST_PATHS_ECMP

workflow:
  - type: BuildGraph
    name: build_graph
  - type: MaximumSupportedDemand
    name: msd
    demand_set: test
    resolution: 0.001

params:
  g_abc1:
    type: enum
    values: ["16", "32", "64"]
    default: "16"
    description: >
      Mesh group count for ABC1 (FADU) <-> BB.
      G=16: k_dc=16 BB/FADU, 9,216 links. Only G that passes feasibility (>=75% retention).
      G=32: k_dc=8, 4,608 links. Fails: device-index causes 50% loss.
      G=64: k_dc=4, 2,304 links. Fails: device-index causes 100% loss.

  g_xyz1:
    type: enum
    values: ["64", "128", "256"]
    default: "64"
    description: >
      Mesh group count for XYZ1 (XSW) <-> BB.
      G=64: k_dc=4, 6,144 links. Best available (4 ports is XSW max).
      G=128: k_dc=2, 3,072 links. Single failure removes 50%+.
      G=256: k_dc=1, 1,536 links. Any BB failure disconnects XSW. Lower alpha but better BAC.

  layout_abc1:
    type: enum
    values:
      # === VALID FOR G=16 ONLY ===
      - "4x4_4x4"    # DC: 4rx9c  BB: 4rx4c   — PG=100%, PS=25%, DI=25%
      - "4x4_8x2"    # DC: 4rx9c  BB: 8rx2c   — PG=50%,  PS=12%, DI=25%
      - "4x4_16x1"   # DC: 4rx9c  BB: 16rx1c  — PG=25%,  PS=6%,  DI=25%  ✓ FEASIBLE
      - "8x2_4x4"    # DC: 2rx18c BB: 4rx4c
      - "8x2_8x2"    # DC: 2rx18c BB: 8rx2c
      - "8x2_16x1"   # DC: 2rx18c BB: 16rx1c  ✓ FEASIBLE
      - "16x1_4x4"   # DC: 1rx36c BB: 4rx4c
      - "16x1_8x2"   # DC: 1rx36c BB: 8rx2c
      - "16x1_16x1"  # DC: 1rx36c BB: 16rx1c  ✓ FEASIBLE
      # === VALID FOR G=32 ONLY ===
      - "8x4_8x4"    # DC: 2rx9c  BB: 8rx1c
      - "8x4_16x2"   # DC: 2rx9c  BB: 4rx2c
      - "8x4_32x1"   # DC: 2rx9c  BB: 2rx4c
      - "16x2_8x4"   # DC: 1rx18c BB: 8rx1c
      - "16x2_16x2"  # DC: 1rx18c BB: 4rx2c
      - "16x2_32x1"  # DC: 1rx18c BB: 2rx4c
      # === VALID FOR G=64 ONLY ===
      - "16x4_16x4"  # DC: 1rx9c  BB: 4rx1c
      - "16x4_32x2"  # DC: 1rx9c  BB: 2rx2c
      - "16x4_64x1"  # DC: 1rx9c  BB: 1rx4c
    default: "4x4_16x1"
    description: >
      Grid factorization: gr_dc x gc_dc _ gr_bb x gc_bb. MUST match g_abc1.
      Format after underscore determines BB block shape (resilience).
      The DC part (before underscore) affects physical device grouping.
      IMPORTANT: Layouts are G-specific. Using a G=32 layout with G=16 will error.

  layout_xyz1:
    type: enum
    values:
      # === VALID FOR G=64 ONLY ===
      - "8x8_16x4"   # DC: 8rx3c   BB: 4rx1c  — best plane-site (25%)
      - "8x8_32x2"   # DC: 8rx3c   BB: 2rx2c
      - "8x8_64x1"   # DC: 8rx3c   BB: 1rx4c
      - "16x4_16x4"  # DC: 4rx6c   BB: 4rx1c  — best plane-site (25%)
      - "16x4_32x2"  # DC: 4rx6c   BB: 2rx2c
      - "16x4_64x1"  # DC: 4rx6c   BB: 1rx4c
      - "32x2_16x4"  # DC: 2rx12c  BB: 4rx1c
      - "32x2_32x2"  # DC: 2rx12c  BB: 2rx2c
      - "32x2_64x1"  # DC: 2rx12c  BB: 1rx4c
      - "64x1_16x4"  # DC: 1rx24c  BB: 4rx1c
      - "64x1_32x2"  # DC: 1rx24c  BB: 2rx2c
      - "64x1_64x1"  # DC: 1rx24c  BB: 1rx4c
      # === VALID FOR G=128 ONLY ===
      - "16x8_32x4"  # DC: 4rx3c  BB: 2rx1c
      - "16x8_64x2"  # DC: 4rx3c  BB: 1rx2c
      - "32x4_32x4"  # DC: 2rx6c  BB: 2rx1c
      - "32x4_64x2"  # DC: 2rx6c  BB: 1rx2c
      - "64x2_32x4"  # DC: 1rx12c BB: 2rx1c
      - "64x2_64x2"  # DC: 1rx12c BB: 1rx2c
      # === VALID FOR G=256 ONLY ===
      - "32x8_64x4"  # DC: 2rx3c  BB: 1rx1c
      - "64x4_64x4"  # DC: 1rx6c  BB: 1rx1c
    default: "16x4_16x4"
    description: >
      Grid factorization: gr_dc x gc_dc _ gr_bb x gc_bb. MUST match g_xyz1.
      XSW grid is 64x24 (device x plane). BB block shape after underscore determines resilience.
      IMPORTANT: Layouts are G-specific. Check the G=N header comments.

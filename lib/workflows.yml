design_analysis_brief:
  - type: NetworkStats
    name: network_statistics
  - type: MaximumSupportedDemand
    name: msd_baseline
    demand_set: baseline_traffic_matrix
    alpha_start: 1.0
    growth_factor: 2.0
    alpha_min: 0.001
    alpha_max: 1000000.0
    alpha_tolerance: 0.05
    max_bracket_iters: 16
    max_bisect_iters: 32
  - type: TrafficMatrixPlacement
    name: tm_placement
    demand_set: baseline_traffic_matrix
    failure_policy: mc_baseline
    iterations: 1000
    workers: 7
    failure_trace: false
    outputs:
      cost_distribution: true
      edge_flows: false
    alpha_from_step: msd_baseline
  - type: CostPower
    name: cost_power
    include_disabled: true
    aggregation_level: 2

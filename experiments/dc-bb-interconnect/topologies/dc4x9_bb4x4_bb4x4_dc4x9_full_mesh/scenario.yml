# Full Mesh: Every DC node connects to every BB node in all planes
#
# Configuration:
#   DC: 4 rows x 9 nodes = 36 nodes per site
#   BB: 4 planes x 4 nodes = 16 nodes per site
#   Total: 52 nodes per site, 104 nodes total
#
# Pattern: Complete bipartite graph between DC and BB
#   Each of 36 DC nodes connects to all 16 BB nodes
#   Maximum path diversity and routing flexibility
#
# Trade-offs:
#   + Best resilience to DC/BB node and link failures
#   + Maximum routing flexibility
#   - Uses maximum links (d_DC=16, at DC device limit)
#   - Higher cabling complexity and cost

blueprints:
  DC_Row:
    nodes:
      node:
        count: 9
        template: "{n}"

  BB_Plane:
    nodes:
      node:
        count: 4
        template: "{n}"

network:
  nodes:
    SiteA/DC-[1-4]:
      blueprint: DC_Row
      attrs:
        role: dc
        site: A
        dc_row_id: ${n}

    SiteA/BB-[1-4]:
      blueprint: BB_Plane
      attrs:
        role: bb
        site: A
        bb_plane_id: ${n}

    SiteB/DC-[1-4]:
      blueprint: DC_Row
      attrs:
        role: dc
        site: B
        dc_row_id: ${n}

    SiteB/BB-[1-4]:
      blueprint: BB_Plane
      attrs:
        role: bb
        site: B
        bb_plane_id: ${n}

  links:
    # Site A: All DC nodes mesh to all BB nodes in all planes
    - source: "SiteA/DC-${dc}/"
      target: "SiteA/BB-${bb}/"
      expand:
        vars:
          dc: [1, 2, 3, 4]
          bb: [1, 2, 3, 4]
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site B: All DC nodes mesh to all BB nodes in all planes
    - source: "SiteB/DC-${dc}/"
      target: "SiteB/BB-${bb}/"
      expand:
        vars:
          dc: [1, 2, 3, 4]
          bb: [1, 2, 3, 4]
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Inter-site BB links
    - source: "SiteA/BB-${p}/"
      target: "SiteB/BB-${p}/"
      expand:
        vars:
          p: [1, 2, 3, 4]
      pattern: mesh
      capacity: 800
      cost: 10
      attrs:
        link_type: bb_intersite
        bb_plane_id: ${p}

risk_groups:
  - name: BB-Plane-1-Links
    membership:
      scope: link
      path: "SiteA/BB-1/node/.*SiteB/BB-1/node/"
  - name: BB-Plane-2-Links
    membership:
      scope: link
      path: "SiteA/BB-2/node/.*SiteB/BB-2/node/"
  - name: BB-Plane-3-Links
    membership:
      scope: link
      path: "SiteA/BB-3/node/.*SiteB/BB-3/node/"
  - name: BB-Plane-4-Links
    membership:
      scope: link
      path: "SiteA/BB-4/node/.*SiteB/BB-4/node/"

  - name: DC-Row-1-SiteA
    membership:
      scope: node
      path: "SiteA/DC-1/"
  - name: DC-Row-2-SiteA
    membership:
      scope: node
      path: "SiteA/DC-2/"
  - name: DC-Row-3-SiteA
    membership:
      scope: node
      path: "SiteA/DC-3/"
  - name: DC-Row-4-SiteA
    membership:
      scope: node
      path: "SiteA/DC-4/"
  - name: DC-Row-1-SiteB
    membership:
      scope: node
      path: "SiteB/DC-1/"
  - name: DC-Row-2-SiteB
    membership:
      scope: node
      path: "SiteB/DC-2/"
  - name: DC-Row-3-SiteB
    membership:
      scope: node
      path: "SiteB/DC-3/"
  - name: DC-Row-4-SiteB
    membership:
      scope: node
      path: "SiteB/DC-4/"

workflow: failure_analysis

# Sparse All-Planes Option 1: Striped assignment across planes
#
# Configuration:
#   DC: 4 rows x 9 nodes = 36 nodes per site
#   BB: 4 planes x 4 nodes = 16 nodes per site
#   Total: 52 nodes per site, 104 nodes total
#
# Pattern: DC node pairs assigned to specific planes
#   DC nodes 1,2 → BB Plane 1 (full mesh)
#   DC nodes 3,4 → BB Plane 2 (full mesh)
#   DC nodes 5,6 → BB Plane 3 (full mesh)
#   DC nodes 7,8 → BB Plane 4 (full mesh)
#   DC node 9 → unconnected (spare)
#
# Trade-offs:
#   + Each DC row reaches all 4 planes (resilient)
#   + Even BB distribution (8 links per BB)
#   - DC node 9 is unconnected in each row
#   - DC-BB link failure has higher impact (81% min ratio)

blueprints:
  DC_Row:
    nodes:
      node:
        count: 9
        template: "{n}"

  BB_Plane:
    nodes:
      node:
        count: 4
        template: "{n}"

network:
  nodes:
    SiteA/DC-[1-4]:
      blueprint: DC_Row
      attrs:
        role: dc
        site: A
        dc_row_id: ${n}

    SiteA/BB-[1-4]:
      blueprint: BB_Plane
      attrs:
        role: bb
        site: A
        bb_plane_id: ${n}

    SiteB/DC-[1-4]:
      blueprint: DC_Row
      attrs:
        role: dc
        site: B
        dc_row_id: ${n}

    SiteB/BB-[1-4]:
      blueprint: BB_Plane
      attrs:
        role: bb
        site: B
        bb_plane_id: ${n}

  links:
    # Site A: DC nodes 1-2 (all rows) mesh to BB Plane 1
    - source:
        path: "SiteA/DC-.*/[12]$"
      target: "SiteA/BB-1/"
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site A: DC nodes 3-4 (all rows) mesh to BB Plane 2
    - source:
        path: "SiteA/DC-.*/[34]$"
      target: "SiteA/BB-2/"
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site A: DC nodes 5-6 (all rows) mesh to BB Plane 3
    - source:
        path: "SiteA/DC-.*/[56]$"
      target: "SiteA/BB-3/"
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site A: DC nodes 7-8 (all rows) mesh to BB Plane 4
    - source:
        path: "SiteA/DC-.*/[78]$"
      target: "SiteA/BB-4/"
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site B: DC nodes 1-2 (all rows) mesh to BB Plane 1
    - source:
        path: "SiteB/DC-.*/[12]$"
      target: "SiteB/BB-1/"
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Site B: DC nodes 3-4 (all rows) mesh to BB Plane 2
    - source:
        path: "SiteB/DC-.*/[34]$"
      target: "SiteB/BB-2/"
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Site B: DC nodes 5-6 (all rows) mesh to BB Plane 3
    - source:
        path: "SiteB/DC-.*/[56]$"
      target: "SiteB/BB-3/"
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Site B: DC nodes 7-8 (all rows) mesh to BB Plane 4
    - source:
        path: "SiteB/DC-.*/[78]$"
      target: "SiteB/BB-4/"
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Inter-site BB links
    - source: "SiteA/BB-${p}/"
      target: "SiteB/BB-${p}/"
      expand:
        vars:
          p: [1, 2, 3, 4]
      pattern: mesh
      capacity: 800
      cost: 10
      attrs:
        link_type: bb_intersite
        bb_plane_id: ${p}

risk_groups:
  - name: BB-Plane-1-Links
    membership:
      scope: link
      path: "SiteA/BB-1/node/.*SiteB/BB-1/node/"
  - name: BB-Plane-2-Links
    membership:
      scope: link
      path: "SiteA/BB-2/node/.*SiteB/BB-2/node/"
  - name: BB-Plane-3-Links
    membership:
      scope: link
      path: "SiteA/BB-3/node/.*SiteB/BB-3/node/"
  - name: BB-Plane-4-Links
    membership:
      scope: link
      path: "SiteA/BB-4/node/.*SiteB/BB-4/node/"

  - name: DC-Row-1-SiteA
    membership:
      scope: node
      path: "SiteA/DC-1/"
  - name: DC-Row-2-SiteA
    membership:
      scope: node
      path: "SiteA/DC-2/"
  - name: DC-Row-3-SiteA
    membership:
      scope: node
      path: "SiteA/DC-3/"
  - name: DC-Row-4-SiteA
    membership:
      scope: node
      path: "SiteA/DC-4/"
  - name: DC-Row-1-SiteB
    membership:
      scope: node
      path: "SiteB/DC-1/"
  - name: DC-Row-2-SiteB
    membership:
      scope: node
      path: "SiteB/DC-2/"
  - name: DC-Row-3-SiteB
    membership:
      scope: node
      path: "SiteB/DC-3/"
  - name: DC-Row-4-SiteB
    membership:
      scope: node
      path: "SiteB/DC-4/"

workflow: failure_analysis

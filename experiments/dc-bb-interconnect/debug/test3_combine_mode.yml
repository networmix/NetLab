# Combine-mode demand across two source and two destination DC nodes.
# A 100 Gbps backbone link limits aggregate delivery.

network:
  nodes:
    SiteA/DC/node/1:
      attrs: { role: dc, site: A }
    SiteA/DC/node/2:
      attrs: { role: dc, site: A }
    SiteA/BB/node/1:
      attrs: { role: bb, site: A }
    SiteB/BB/node/1:
      attrs: { role: bb, site: B }
    SiteB/DC/node/1:
      attrs: { role: dc, site: B }
    SiteB/DC/node/2:
      attrs: { role: dc, site: B }

  links:
    # All DC-A to BB-A (high capacity)
    - source: "SiteA/DC/"
      target: "SiteA/BB/"
      pattern: mesh
      capacity: 1000
      cost: 1
    # BB-A to BB-B (BOTTLENECK)
    - source: "SiteA/BB/node/1"
      target: "SiteB/BB/node/1"
      capacity: 100
      cost: 10
    # BB-B to all DC-B (high capacity)
    - source: "SiteB/BB/"
      target: "SiteB/DC/"
      pattern: mesh
      capacity: 1000
      cost: 1

demands:
  test:
    - source: "^SiteA/DC"
      target: "^SiteB/DC"
      volume: 1000
      mode: combine
      flow_policy: SHORTEST_PATHS_ECMP

workflow:
  - type: BuildGraph
    name: build_graph
  - type: MaximumSupportedDemand
    name: msd
    demand_set: test
    resolution: 0.001

# Balanced Dense: Skip-one rotation for high resilience with even distribution
#
# Configuration:
#   DC: 4 rows x 9 nodes = 36 nodes per site
#   BB: 4 planes x 4 nodes = 16 nodes per site
#   Total: 52 nodes per site, 104 nodes total
#
# Pattern: Each DC connects to 3 of 4 BB nodes per plane (skips one)
#   DC-1,5 → BB 2,3,4 in all planes (skip BB 1)
#   DC-2,6 → BB 1,3,4 in all planes (skip BB 2)
#   DC-3,7 → BB 1,2,4 in all planes (skip BB 3)
#   DC-4,8 → BB 1,2,3 in all planes (skip BB 4)
#   DC-9 → unconnected (enables perfect even distribution)
#
# Trade-offs:
#   + Best DC-BB link resilience (99.82%) among balanced patterns
#   + 3 BB options per plane provides excellent path redundancy
#   + Perfectly even BB distribution (24 links each)
#   - Higher link count than semi-dense (but still < full_mesh)
#   - DC node 9 unconnected (8/9 DC nodes used)

blueprints:
  DC_Row:
    nodes:
      node:
        count: 9
        template: "{n}"

  BB_Plane:
    nodes:
      node:
        count: 4
        template: "{n}"

network:
  nodes:
    SiteA/DC-[1-4]:
      blueprint: DC_Row
      attrs:
        role: dc
        site: A
        dc_row_id: ${n}

    SiteA/BB-[1-4]:
      blueprint: BB_Plane
      attrs:
        role: bb
        site: A
        bb_plane_id: ${n}

    SiteB/DC-[1-4]:
      blueprint: DC_Row
      attrs:
        role: dc
        site: B
        dc_row_id: ${n}

    SiteB/BB-[1-4]:
      blueprint: BB_Plane
      attrs:
        role: bb
        site: B
        bb_plane_id: ${n}

  links:
    # Site A: DC nodes 1,5 → BB 2,3,4 in all planes (skip BB 1)
    - source:
        path: "SiteA/DC-.*/[15]$"
      target: "SiteA/BB-${p}/node/${r}"
      expand:
        vars:
          p: [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]
          r: [2, 3, 4, 2, 3, 4, 2, 3, 4, 2, 3, 4]
        mode: zip
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site A: DC nodes 2,6 → BB 1,3,4 in all planes (skip BB 2)
    - source:
        path: "SiteA/DC-.*/[26]$"
      target: "SiteA/BB-${p}/node/${r}"
      expand:
        vars:
          p: [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]
          r: [1, 3, 4, 1, 3, 4, 1, 3, 4, 1, 3, 4]
        mode: zip
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site A: DC nodes 3,7 → BB 1,2,4 in all planes (skip BB 3)
    - source:
        path: "SiteA/DC-.*/[37]$"
      target: "SiteA/BB-${p}/node/${r}"
      expand:
        vars:
          p: [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]
          r: [1, 2, 4, 1, 2, 4, 1, 2, 4, 1, 2, 4]
        mode: zip
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site A: DC nodes 4,8 → BB 1,2,3 in all planes (skip BB 4)
    - source:
        path: "SiteA/DC-.*/[48]$"
      target: "SiteA/BB-${p}/node/${r}"
      expand:
        vars:
          p: [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]
          r: [1, 2, 3, 1, 2, 3, 1, 2, 3, 1, 2, 3]
        mode: zip
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site B: DC nodes 1,5 → BB 2,3,4 in all planes (skip BB 1)
    - source:
        path: "SiteB/DC-.*/[15]$"
      target: "SiteB/BB-${p}/node/${r}"
      expand:
        vars:
          p: [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]
          r: [2, 3, 4, 2, 3, 4, 2, 3, 4, 2, 3, 4]
        mode: zip
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Site B: DC nodes 2,6 → BB 1,3,4 in all planes (skip BB 2)
    - source:
        path: "SiteB/DC-.*/[26]$"
      target: "SiteB/BB-${p}/node/${r}"
      expand:
        vars:
          p: [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]
          r: [1, 3, 4, 1, 3, 4, 1, 3, 4, 1, 3, 4]
        mode: zip
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Site B: DC nodes 3,7 → BB 1,2,4 in all planes (skip BB 3)
    - source:
        path: "SiteB/DC-.*/[37]$"
      target: "SiteB/BB-${p}/node/${r}"
      expand:
        vars:
          p: [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]
          r: [1, 2, 4, 1, 2, 4, 1, 2, 4, 1, 2, 4]
        mode: zip
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Site B: DC nodes 4,8 → BB 1,2,3 in all planes (skip BB 4)
    - source:
        path: "SiteB/DC-.*/[48]$"
      target: "SiteB/BB-${p}/node/${r}"
      expand:
        vars:
          p: [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 4]
          r: [1, 2, 3, 1, 2, 3, 1, 2, 3, 1, 2, 3]
        mode: zip
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Inter-site BB links (full mesh per plane)
    - source: "SiteA/BB-${p}/"
      target: "SiteB/BB-${p}/"
      expand:
        vars:
          p: [1, 2, 3, 4]
      pattern: mesh
      capacity: 800
      cost: 10
      attrs:
        link_type: bb_intersite
        bb_plane_id: ${p}

risk_groups:
  - name: BB-Plane-1-Links
    membership:
      scope: link
      path: "SiteA/BB-1/node/.*SiteB/BB-1/node/"
  - name: BB-Plane-2-Links
    membership:
      scope: link
      path: "SiteA/BB-2/node/.*SiteB/BB-2/node/"
  - name: BB-Plane-3-Links
    membership:
      scope: link
      path: "SiteA/BB-3/node/.*SiteB/BB-3/node/"
  - name: BB-Plane-4-Links
    membership:
      scope: link
      path: "SiteA/BB-4/node/.*SiteB/BB-4/node/"

  - name: DC-Row-1-SiteA
    membership:
      scope: node
      path: "SiteA/DC-1/"
  - name: DC-Row-2-SiteA
    membership:
      scope: node
      path: "SiteA/DC-2/"
  - name: DC-Row-3-SiteA
    membership:
      scope: node
      path: "SiteA/DC-3/"
  - name: DC-Row-4-SiteA
    membership:
      scope: node
      path: "SiteA/DC-4/"
  - name: DC-Row-1-SiteB
    membership:
      scope: node
      path: "SiteB/DC-1/"
  - name: DC-Row-2-SiteB
    membership:
      scope: node
      path: "SiteB/DC-2/"
  - name: DC-Row-3-SiteB
    membership:
      scope: node
      path: "SiteB/DC-3/"
  - name: DC-Row-4-SiteB
    membership:
      scope: node
      path: "SiteB/DC-4/"

workflow: failure_analysis

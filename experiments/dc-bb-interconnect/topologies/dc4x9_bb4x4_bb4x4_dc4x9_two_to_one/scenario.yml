# Two-to-One: Two DC rows share one BB plane (2 planes total)
#
# Configuration:
#   DC: 4 rows x 9 nodes = 36 nodes per site
#   BB: 2 planes x 4 nodes = 8 nodes per site
#   Total: 44 nodes per site, 88 nodes total
#
# Pattern: Two DC rows mesh to one BB plane
#   DC-1, DC-2 → BB-1 (full mesh)
#   DC-3, DC-4 → BB-2 (full mesh)
#
# WARNING: 50% FAILURE MODE
#   - Only 2 BB planes exist, each carries 50% of traffic
#   - Single plane failure = 50% capacity loss
#   - Alpha* is only 50% of maximum due to reduced inter-site capacity

blueprints:
  DC_Row:
    nodes:
      node:
        count: 9
        template: "{n}"

  BB_Plane:
    nodes:
      node:
        count: 4
        template: "{n}"

network:
  nodes:
    SiteA/DC-[1-4]:
      blueprint: DC_Row
      attrs:
        role: dc
        site: A
        dc_row_id: ${n}

    SiteA/BB-[1-2]:
      blueprint: BB_Plane
      attrs:
        role: bb
        site: A
        bb_plane_id: ${n}

    SiteB/DC-[1-4]:
      blueprint: DC_Row
      attrs:
        role: dc
        site: B
        dc_row_id: ${n}

    SiteB/BB-[1-2]:
      blueprint: BB_Plane
      attrs:
        role: bb
        site: B
        bb_plane_id: ${n}

  links:
    # Site A: DC-1 and DC-2 mesh to BB-1
    - source: "SiteA/DC-${i}/"
      target: "SiteA/BB-1/"
      expand:
        vars:
          i: [1, 2]
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site A: DC-3 and DC-4 mesh to BB-2
    - source: "SiteA/DC-${i}/"
      target: "SiteA/BB-2/"
      expand:
        vars:
          i: [3, 4]
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: A

    # Site B: DC-1 and DC-2 mesh to BB-1
    - source: "SiteB/DC-${i}/"
      target: "SiteB/BB-1/"
      expand:
        vars:
          i: [1, 2]
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Site B: DC-3 and DC-4 mesh to BB-2
    - source: "SiteB/DC-${i}/"
      target: "SiteB/BB-2/"
      expand:
        vars:
          i: [3, 4]
      pattern: mesh
      capacity: 400
      cost: 1
      attrs:
        link_type: dc_bb
        site: B

    # Inter-site BB links (only 2 planes)
    - source: "SiteA/BB-${p}/"
      target: "SiteB/BB-${p}/"
      expand:
        vars:
          p: [1, 2]
      pattern: mesh
      capacity: 800
      cost: 10
      attrs:
        link_type: bb_intersite
        bb_plane_id: ${p}

risk_groups:
  - name: BB-Plane-1-Links
    membership:
      scope: link
      path: "SiteA/BB-1/node/.*SiteB/BB-1/node/"
  - name: BB-Plane-2-Links
    membership:
      scope: link
      path: "SiteA/BB-2/node/.*SiteB/BB-2/node/"

  - name: DC-Row-1-SiteA
    membership:
      scope: node
      path: "SiteA/DC-1/"
  - name: DC-Row-2-SiteA
    membership:
      scope: node
      path: "SiteA/DC-2/"
  - name: DC-Row-3-SiteA
    membership:
      scope: node
      path: "SiteA/DC-3/"
  - name: DC-Row-4-SiteA
    membership:
      scope: node
      path: "SiteA/DC-4/"
  - name: DC-Row-1-SiteB
    membership:
      scope: node
      path: "SiteB/DC-1/"
  - name: DC-Row-2-SiteB
    membership:
      scope: node
      path: "SiteB/DC-2/"
  - name: DC-Row-3-SiteB
    membership:
      scope: node
      path: "SiteB/DC-3/"
  - name: DC-Row-4-SiteB
    membership:
      scope: node
      path: "SiteB/DC-4/"

workflow: failure_analysis

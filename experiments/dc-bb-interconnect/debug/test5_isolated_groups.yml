# Four isolated DC-to-DC paths through corresponding BB nodes.
# Combine-mode demand can use the reachable source/destination pairs.

blueprints:
  DC:
    nodes:
      node:
        count: 1
        template: "{n}"
  BB:
    nodes:
      node:
        count: 1
        template: "{n}"

network:
  nodes:
    SiteA/DC-[1-4]:
      blueprint: DC
      attrs: { role: dc, site: A }
    SiteA/BB-[1-4]:
      blueprint: BB
      attrs: { role: bb, site: A }
    SiteB/BB-[1-4]:
      blueprint: BB
      attrs: { role: bb, site: B }
    SiteB/DC-[1-4]:
      blueprint: DC
      attrs: { role: dc, site: B }

  links:
    # DC-1 to BB-1 only (isolated)
    - source: "SiteA/DC-${i}/"
      target: "SiteA/BB-${i}/"
      expand:
        vars:
          i: [1, 2, 3, 4]
      capacity: 1000
      cost: 1

    # BB-A to BB-B (1:1)
    - source: "SiteA/BB-${i}/"
      target: "SiteB/BB-${i}/"
      expand:
        vars:
          i: [1, 2, 3, 4]
      capacity: 100
      cost: 10

    # BB to DC at Site B (1:1)
    - source: "SiteB/BB-${i}/"
      target: "SiteB/DC-${i}/"
      expand:
        vars:
          i: [1, 2, 3, 4]
      capacity: 1000
      cost: 1

demands:
  test:
    - source: "^SiteA/DC"
      target: "^SiteB/DC"
      volume: 1000
      mode: combine
      flow_policy: SHORTEST_PATHS_ECMP

workflow:
  - type: BuildGraph
    name: build_graph
  - type: MaximumSupportedDemand
    name: msd
    demand_set: test
    resolution: 0.001

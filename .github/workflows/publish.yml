name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Validate release tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          if [[ "$REF_TYPE" != tag || "$RELEASE_TAG" != v?* ]]; then
            echo "Expected a v-prefixed version tag, got $REF_TYPE: $RELEASE_TAG" >&2
            exit 1
          fi
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Verify release assets
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil

          version = os.environ["VERSION"]
          assets = Path("release-assets")
          packages = Path("dist")
          filenames = {f"netlab-{version}-py3-none-any.whl", f"netlab-{version}.tar.gz"}
          if {path.name for path in assets.iterdir()} != filenames | {"SHA256SUMS"}:
              raise SystemExit("Release assets must be exactly the version's wheel, sdist and SHA256SUMS")
          if not all(path.is_file() for path in assets.iterdir()):
              raise SystemExit("Release assets must be regular files")

          checksums = {}
          for line in (assets / "SHA256SUMS").read_text().splitlines():
              match = re.fullmatch(r"([0-9a-fA-F]{64}) [ *](.+)", line)
              if match is None or match[2] not in filenames or match[2] in checksums:
                  raise SystemExit("SHA256SUMS must name exactly the wheel and sdist once each")
              checksums[match[2]] = match[1].lower()
          if set(checksums) != filenames:
              raise SystemExit("SHA256SUMS must name exactly the wheel and sdist once each")

          for filename in sorted(filenames):
              with (assets / filename).open("rb") as artifact:
                  digest = hashlib.file_digest(artifact, "sha256").hexdigest()
              if digest != checksums[filename]:
                  raise SystemExit(f"SHA256 mismatch: {filename}")
              print(f"SHA256 verified: {filename} {digest}")

          packages.mkdir()
          for filename in sorted(filenames):
              shutil.move(assets / filename, packages / filename)
          PY

      - name: Check packages
        run: python -m twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

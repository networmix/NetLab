# Inter-site demand definitions for DC-BB experiments

demands:
  inter_site:
    # Site A DC to Site B DC (bidirectional)
    # 10 Tbps in each direction
    - source: "^SiteA/DC-.*"
      target: "^SiteB/DC-.*"
      volume: 10000
      mode: combine
      flow_policy: SHORTEST_PATHS_ECMP
    - source: "^SiteB/DC-.*"
      target: "^SiteA/DC-.*"
      volume: 10000
      mode: combine
      flow_policy: SHORTEST_PATHS_ECMP

# Unidirectional chain with a 100 Gbps cross-site bottleneck.
# Demand is 1,000 Gbps; the capacity upper bound on alpha is 0.1.

network:
  nodes:
    SiteA/DC/node/1:
      attrs:
        role: dc
        site: A
    SiteA/BB/node/1:
      attrs:
        role: bb
        site: A
    SiteB/BB/node/1:
      attrs:
        role: bb
        site: B
    SiteB/DC/node/1:
      attrs:
        role: dc
        site: B

  links:
    # DC-A to BB-A: high capacity
    - source: "SiteA/DC/node/1"
      target: "SiteA/BB/node/1"
      capacity: 1000
      cost: 1

    # BB-A to BB-B: low capacity (bottleneck)
    - source: "SiteA/BB/node/1"
      target: "SiteB/BB/node/1"
      capacity: 100
      cost: 10

    # BB-B to DC-B: high capacity
    - source: "SiteB/BB/node/1"
      target: "SiteB/DC/node/1"
      capacity: 1000
      cost: 1

demands:
  test:
    - source: "SiteA/DC/node/1"
      target: "SiteB/DC/node/1"
      volume: 1000
      flow_policy: SHORTEST_PATHS_ECMP

workflow:
  - type: BuildGraph
    name: build_graph
  - type: MaximumSupportedDemand
    name: msd
    demand_set: test

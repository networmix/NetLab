params:
  g_abc1:
    type: enum
    values: ["16", "32", "64"]
    default: "16"
    description: >
      Mesh group count for ABC1 (FADU) <-> BB.
      G=16: k_dc=16 BB/FADU, 9,216 links. Only G that passes feasibility (>=75% retention).
      G=32: k_dc=8, 4,608 links. Fails the 75% connection-retention rule.
      G=64: k_dc=4, 2,304 links. Fails the 75% connection-retention rule.

  g_xyz1:
    type: enum
    values: ["64", "128", "256"]
    default: "64"
    description: >
      Mesh group count for XYZ1 (XSW) <-> BB.
      G=64: k_dc=4, 6,144 links. Uses all 4 available XSW ports.
      G=128: k_dc=2, 3,072 links. Single failure removes 50%+.
      G=256: k_dc=1, 1,536 links. Loss of the attached BB device disconnects its XSWs.

  layout_abc1:
    type: enum
    values:
      # G=16
      - "4x4_4x4"  # DC block: 4x9; BB block: 16x1
      - "4x4_8x2"  # DC block: 4x9; BB block: 8x2
      - "4x4_16x1"  # DC block: 4x9; BB block: 4x4
      - "8x2_4x4"  # DC block: 2x18; BB block: 16x1
      - "8x2_8x2"  # DC block: 2x18; BB block: 8x2
      - "8x2_16x1"  # DC block: 2x18; BB block: 4x4
      - "16x1_4x4"  # DC block: 1x36; BB block: 16x1
      - "16x1_8x2"  # DC block: 1x36; BB block: 8x2
      - "16x1_16x1"  # DC block: 1x36; BB block: 4x4
      # G=32
      - "8x4_8x4"  # DC block: 2x9; BB block: 8x1
      - "8x4_16x2"  # DC block: 2x9; BB block: 4x2
      - "8x4_32x1"  # DC block: 2x9; BB block: 2x4
      - "16x2_8x4"  # DC block: 1x18; BB block: 8x1
      - "16x2_16x2"  # DC block: 1x18; BB block: 4x2
      - "16x2_32x1"  # DC block: 1x18; BB block: 2x4
      # G=64
      - "16x4_16x4"  # DC block: 1x9; BB block: 4x1
      - "16x4_32x2"  # DC block: 1x9; BB block: 2x2
      - "16x4_64x1"  # DC block: 1x9; BB block: 1x4
    default: "4x4_16x1"
    description: >
      Grid factorization: gr_dc x gc_dc _ gr_bb x gc_bb. Both grid partition products must equal g_abc1.
      Counts after the underscore partition the BB grid.
      The DC part (before underscore) affects physical device grouping.

  layout_xyz1:
    type: enum
    values:
      # G=64
      - "8x8_16x4"  # DC block: 8x3; BB block: 4x1
      - "8x8_32x2"  # DC block: 8x3; BB block: 2x2
      - "8x8_64x1"  # DC block: 8x3; BB block: 1x4
      - "16x4_16x4"  # DC block: 4x6; BB block: 4x1
      - "16x4_32x2"  # DC block: 4x6; BB block: 2x2
      - "16x4_64x1"  # DC block: 4x6; BB block: 1x4
      - "32x2_16x4"  # DC block: 2x12; BB block: 4x1
      - "32x2_32x2"  # DC block: 2x12; BB block: 2x2
      - "32x2_64x1"  # DC block: 2x12; BB block: 1x4
      - "64x1_16x4"  # DC block: 1x24; BB block: 4x1
      - "64x1_32x2"  # DC block: 1x24; BB block: 2x2
      - "64x1_64x1"  # DC block: 1x24; BB block: 1x4
      # G=128
      - "16x8_32x4"  # DC block: 4x3; BB block: 2x1
      - "16x8_64x2"  # DC block: 4x3; BB block: 1x2
      - "32x4_32x4"  # DC block: 2x6; BB block: 2x1
      - "32x4_64x2"  # DC block: 2x6; BB block: 1x2
      - "64x2_32x4"  # DC block: 1x12; BB block: 2x1
      - "64x2_64x2"  # DC block: 1x12; BB block: 1x2
      # G=256
      - "32x8_64x4"  # DC block: 2x3; BB block: 1x1
      - "64x4_64x4"  # DC block: 1x6; BB block: 1x1
    default: "16x4_16x4"
    description: >
      Grid factorization: gr_dc x gc_dc _ gr_bb x gc_bb. Both grid partition products must equal g_xyz1.
      XSW grid is 64x24 (device x plane). BB partition counts follow the underscore.
